name: CI

on:
  push:
    branches: [main]
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "Tests/**"
      - ".swift-format"
      - ".github/workflows/ci.yml"
      - "scripts/ci-swift.sh"
      - "script/**"
      - "project.yml"
      - "App/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "Sources/**"
      - "Tests/**"
      - ".swift-format"
      - ".github/workflows/ci.yml"
      - "scripts/ci-swift.sh"
      - "script/**"
      - "project.yml"
      - "App/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Where jobs run: GitHub-hosted runners by default. Setting the repository
# variable CI_RUNNER to "self-hosted" moves both jobs to the Mac runner, which
# uses no Actions minutes (docs/self-hosted-runner.md). Pull requests from forks
# always stay on GitHub-hosted runners so outside code never runs on the Mac.
# The same condition appears in each job below because job-level `if` and
# `runs-on` can't read workflow-level env.

jobs:
  linux:
    name: Linux (Swift 6.4)
    runs-on: ${{ (vars.CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # scripts/ci-swift.sh runs every Swift command in this image, so the job is
      # identical on GitHub's Ubuntu runner and on the Mac (via OrbStack).
      SWIFT_IMAGE: swift:6.4-noble
    steps:
      - uses: actions/checkout@v6

      - name: Validate workspace scripts
        run: |
          for script in script/*.sh scripts/*.sh; do
            bash -n "$script"
          done

      - name: Check for a Swift package
        id: package
        run: |
          if [ -f Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Package.swift yet (see issue #3), so build and test steps are skipped."
          fi

      - uses: actions/cache@v4
        if: steps.package.outputs.present == 'true'
        with:
          path: .build
          # The container matches the runner's CPU: x86_64 on GitHub, arm64 on the Mac.
          key: linux-${{ runner.arch }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: linux-${{ runner.arch }}-spm-

      - name: Build
        if: steps.package.outputs.present == 'true'
        run: scripts/ci-swift.sh build --build-tests

      - name: Test
        if: steps.package.outputs.present == 'true'
        run: scripts/ci-swift.sh test --skip-build

      - name: Lint formatting
        if: steps.package.outputs.present == 'true'
        run: scripts/ci-swift.sh format lint --strict --recursive Sources Tests App

  macos:
    name: macOS (Xcode)
    needs: linux
    # GitHub-hosted macOS minutes count 10x against the Actions quota, so hosted
    # runs skip draft PRs. The self-hosted Mac costs no minutes, so it builds drafts too.
    if: (vars.CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) || github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ (vars.CI_RUNNER == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Check for a Swift package
        id: package
        run: |
          if [ -f Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Package.swift yet (see issue #3), so build and test steps are skipped."
          fi

      # `xcrun swift` always uses the selected Xcode's toolchain. A plain `swift`
      # on the Mac could resolve to a swiftly toolchain or a .swift-version pin instead.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - uses: actions/cache@v4
        if: steps.package.outputs.present == 'true'
        with:
          path: .build
          key: macos-${{ runner.arch }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: macos-${{ runner.arch }}-spm-

      - name: Build
        if: steps.package.outputs.present == 'true'
        run: xcrun swift build --build-tests

      - name: Test
        if: steps.package.outputs.present == 'true'
        run: xcrun swift test --skip-build

      # The app target lives in an XcodeGen spec. The self-hosted Mac has xcodegen from
      # Homebrew (docs/self-hosted-runner.md), possibly outside the runner's saved PATH;
      # GitHub's macOS image doesn't have it, so install it there.
      - name: Install XcodeGen
        if: hashFiles('project.yml') != ''
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            :
          elif [ -x /opt/homebrew/bin/xcodegen ]; then
            echo /opt/homebrew/bin >> "$GITHUB_PATH"
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        if: hashFiles('project.yml') != ''
        run: xcodegen generate

      # Signing is off: CI only checks that the app compiles and links.
      - name: Build app
        if: hashFiles('project.yml') != ''
        run: |
          xcodebuild build \
            -project NotchSuite.xcodeproj \
            -scheme NotchSuite \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
