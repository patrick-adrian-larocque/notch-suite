name: Claude issue triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-triage-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Check for the Claude credential
        id: auth
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The CLAUDE_CODE_OAUTH_TOKEN repository secret is not set (see issue #10), so triage was skipped."
          fi

      # The triage skill lives in .claude/skills/, so the repo must be checked out.
      - uses: actions/checkout@v6
        if: steps.auth.outputs.ready == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /triage-issue ${{ github.event.issue.number }}
          claude_args: --max-turns 10
