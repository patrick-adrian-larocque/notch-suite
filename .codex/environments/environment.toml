version = 1
name = "Notch Suite"

[setup]
script = "./script/setup.sh"

[[actions]]
name = "Run"
icon = "run"
command = "./script/build_and_run.sh"

[[actions]]
name = "Verify"
icon = "test"
command = "./script/verify.sh"

[[actions]]
name = "Build app"
icon = "run"
command = "./script/build_and_run.sh --build-only"

[[actions]]
name = "Lint"
icon = "test"
command = "swift format lint --strict --recursive Sources Tests App AppTests"
